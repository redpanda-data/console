---
name: "Frontend Lint & Compile check"
on:
  workflow_call:
env:
  CI: true
  BUN_CACHE_SALT: 2026-10-20-test-runners
jobs:
  lint:
    timeout-minutes: 3
    runs-on: blacksmith-2vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: frontend/.nvmrc
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned: bun generates yarn.lock (bunfig print = "yarn") and the output
          # changes between bun versions, which trips the lint job's dirty-tree check.
          bun-version-file: frontend/.bun-version
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          # Matches package.json engines; native deps (isolated-vm) ship no Node 20 prebuilds.
          node-version-file: frontend/.nvmrc
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Get Biome version
        id: biome-version
        run: echo "version=$(jq -r '.devDependencies["@biomejs/biome"]' package.json)" >> "$GITHUB_OUTPUT"
      - name: Setup Biome
        uses: biomejs/setup-biome@v2
        with:
          version: ${{ steps.biome-version.outputs.version }}
      - name: Check Ultracite setup
        run: bun x ultracite doctor
      - name: Run Biome/Ultracite
        run: |
          bun run lint
          CHANGED=$(git status --porcelain)
          if [ -n "$CHANGED" ]; then
            echo "::error::Lint produced uncommitted changes. Run 'bun run lint' locally and commit the result."
            echo "$CHANGED"
            exit 1
          fi

  type-check:
    timeout-minutes: 3
    runs-on: blacksmith-2vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: frontend/.nvmrc
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned: bun generates yarn.lock (bunfig print = "yarn") and the output
          # changes between bun versions, which trips the lint job's dirty-tree check.
          bun-version-file: frontend/.bun-version
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          # Matches package.json engines; native deps (isolated-vm) ship no Node 20 prebuilds.
          node-version-file: frontend/.nvmrc
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run typecheck
        run: |
          bun run type:check
          bun run type:check:tests

  build:
    timeout-minutes: 5
    runs-on: blacksmith-8vcpu-ubuntu-2404
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: frontend/.nvmrc
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned: bun generates yarn.lock (bunfig print = "yarn") and the output
          # changes between bun versions, which trips the lint job's dirty-tree check.
          bun-version-file: frontend/.bun-version
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          # Matches package.json engines; native deps (isolated-vm) ship no Node 20 prebuilds.
          node-version-file: frontend/.nvmrc
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Restore Rspack build cache
        uses: actions/cache@v5
        with:
          path: frontend/node_modules/.cache
          key: ${{ runner.os }}-rspack-${{ env.BUN_CACHE_SALT }}-${{ hashFiles('frontend/bun.lock', 'frontend/package.json', 'frontend/src/**', 'frontend/rsbuild.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-rspack-${{ env.BUN_CACHE_SALT }}-
      - name: Run build frontend
        run: |
          REACT_APP_CONSOLE_GIT_SHA=$(echo "$GITHUB_SHA" | cut -c 1-6)
          REACT_APP_CONSOLE_GIT_REF=$GITHUB_REF_NAME
          REACT_APP_BUILD_TIMESTAMP=$(date +%s)
          REACT_APP_DEV_HINT=true
          export REACT_APP_CONSOLE_GIT_SHA REACT_APP_CONSOLE_GIT_REF REACT_APP_BUILD_TIMESTAMP REACT_APP_DEV_HINT
          bun run build
      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-build
          path: frontend/build
          retention-days: 1
      - name: Build E2E backend image
        run: bun run e2e-build:oss
      - name: Export E2E backend image
        run: docker image save console-backend:e2e-test --output "$RUNNER_TEMP/e2e-backend.tar"
      - name: Upload E2E backend image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-backend-image
          path: ${{ runner.temp }}/e2e-backend.tar
          compression-level: 1
          retention-days: 1

  test-unit:
    timeout-minutes: 3
    runs-on: blacksmith-2vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: frontend/.nvmrc
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned: bun generates yarn.lock (bunfig print = "yarn") and the output
          # changes between bun versions, which trips the lint job's dirty-tree check.
          bun-version-file: frontend/.bun-version
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          # Matches package.json engines; native deps (isolated-vm) ship no Node 20 prebuilds.
          node-version-file: frontend/.nvmrc
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run unit tests
        run: bun run test:unit
      - name: Run Module Federation tests
        run: bun run test:federation -- --bail=1
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: unit-test-results
          path: frontend/.rstest
          include-hidden-files: true
          retention-days: 2

  test-integration:
    timeout-minutes: 5
    runs-on: blacksmith-8vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: frontend/.nvmrc
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned: bun generates yarn.lock (bunfig print = "yarn") and the output
          # changes between bun versions, which trips the lint job's dirty-tree check.
          bun-version-file: frontend/.bun-version
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          # Matches package.json engines; native deps (isolated-vm) ship no Node 20 prebuilds.
          node-version-file: frontend/.nvmrc
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run integration tests
        run: bun run test:integration -- --coverage --reporter=md --reporter=github-actions --reporter=blob --shard=${{ matrix.shard }}/2
      - name: Upload integration coverage shard
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ !cancelled() }}
        with:
          name: integration-coverage-shard-${{ matrix.shard }}
          path: frontend/.rstest-reports
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 2
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: integration-test-results-${{ matrix.shard }}
          path: frontend/.rstest
          include-hidden-files: true
          retention-days: 2

  coverage:
    needs: test-integration
    timeout-minutes: 5
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: frontend/.nvmrc
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: frontend/.bun-version
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: integration-coverage-shard-1
          path: frontend/.rstest-reports
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: integration-coverage-shard-2
          path: frontend/.rstest-reports
      - name: Enforce combined integration coverage
        run: bun run test:coverage:merge
      - name: Upload integration coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ !cancelled() }}
        with:
          name: integration-coverage-report
          path: frontend/coverage-integration
          if-no-files-found: error
          retention-days: 2

  test-browser:
    needs: build
    timeout-minutes: 10
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: frontend/.nvmrc
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: frontend/.bun-version
      - run: bun install --frozen-lockfile
      - run: bun run install:chromium --with-deps
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: frontend-build
          path: frontend/build
      - run: bun run test:browser
      - run: bun run test:e2e:canary
      - run: bun run test:bundle
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: browser-test-results
          path: |
            frontend/.rstest
            frontend/tests/bundle/.rstest
          include-hidden-files: true
          retention-days: 2

  test-e2e:
    needs: build
    timeout-minutes: 30
    runs-on: blacksmith-8vcpu-ubuntu-2404
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        variant: [console, kafka, kafka-connect]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: frontend/.nvmrc
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: frontend/.bun-version
      - run: bun install --frozen-lockfile
      - run: bun run install:chromium --with-deps
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: e2e-backend-image
          path: ${{ runner.temp }}/e2e-backend
      - name: Load E2E backend image
        run: |
          docker image load --input "$RUNNER_TEMP/e2e-backend/e2e-backend.tar"
          docker image inspect console-backend:e2e-test --format '{{.Id}}'
      - name: Run running-application tests
        env:
          E2E_VARIANT: ${{ matrix.variant }}
          E2E_PREBUILT_IMAGE_TAG: console-backend:e2e-test
        run: bun run e2e-test:variant "$E2E_VARIANT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: e2e-test-results-${{ matrix.variant }}
          path: |
            frontend/.rstest
            frontend/tests/.rstest
            frontend/tests/test-variant-*/.rstest
          include-hidden-files: true
          retention-days: 2
